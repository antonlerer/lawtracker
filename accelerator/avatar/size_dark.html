<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1250px;height:750px;background:#17352C}
.wrap{width:1250px;height:750px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(circle at 15% 10%,#1E4137 0,#17352C 65%)}
.mark{position:relative;width:400px;height:400px;border-radius:108px 108px 108px 32px;background:#F4F7F4;display:grid;place-items:center;
 font:700 252px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#22574A;padding-bottom:8px;box-sizing:border-box;margin-top:44px}
.mark:after{content:"";position:absolute;right:44px;top:-48px;width:84px;height:144px;background:#D8AE72;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.name{font:700 124px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#F4F7F4;letter-spacing:2px;white-space:nowrap}
.name span{color:#D8AE72;margin-left:4px}
</style>
<div class="wrap"><div class="mark">§</div><div class="name">Law<span>Tracker</span></div></div>
