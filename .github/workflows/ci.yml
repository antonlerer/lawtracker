name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lt
          POSTGRES_PASSWORD: lt
          POSTGRES_DB: lt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lt" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Проверка кода
        run: ruff check app ingest tests migrations --select E9,F63,F7,F82,F401,F811,F841 --ignore E501
      - name: Тесты (${{ matrix.db }})
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://lt:lt@localhost:5432/lt_test' || '' }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          pytest -q
      - name: Миграции на PostgreSQL
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg2://lt:lt@localhost:5432/lt_migrate
        run: |
          PGPASSWORD=lt psql -h localhost -U lt -d lt_test -c "CREATE DATABASE lt_migrate"
          alembic upgrade head
          alembic check
