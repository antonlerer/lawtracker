<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1360px;height:520px;background:#FFFFFF}
.wrap{width:1360px;height:520px;display:flex;align-items:center;justify-content:center;gap:60px;background:#FFFFFF}
.mark{position:relative;flex:none;width:260px;height:260px;border-radius:70px 70px 70px 21px;background:#22574A;display:grid;place-items:center;
 font:700 165px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#F4F7F4;padding-bottom:6px;box-sizing:border-box;margin-top:30px}
.mark:after{content:"";position:absolute;right:30px;top:-32px;width:56px;height:94px;background:#C48A33;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.name{font:700 140px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#17352C;letter-spacing:2px;white-space:nowrap}
.name span{color:#22574A;margin-left:6px}
</style>
<div class="wrap"><div class="mark">§</div><div class="name">Law<span>Tracker</span></div></div>
