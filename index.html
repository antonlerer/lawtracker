<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LawTracker — мониторинг изменений законодательства</title>
<meta name="description" content="LawTracker — платформа юридического анализа изменений в законодательстве: персональные дайджесты для вашей компании в кабинете и Telegram.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F0;--bg-raised:#FFFFFF;--sidebar:#EBEEE8;--panel:#17352C;
  --ink:#16201B;--ink-soft:#4A554E;--ink-faint:#67726A;--line:#DBDFD7;
  --accent:#22574A;--accent-ink:#F4F7F4;--accent-soft:#E4EBE6;--amber:#8A5A20;--amber-soft:#F2E7D5;
  --red:#A23B2E;--red-soft:#F5E4E0;--blue:#2F5573;--blue-soft:#E1EAF1;--radius:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05);--focus:#1B6FD8;
  --f-head:"PT Serif",Georgia,serif;--f-body:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;--panel-2:#1E4137;--panel-line:#2C5347;--panel-accent:#6FAE97;--panel-tag-bg:#2C5347;--panel-tag-ink:#9FDBC3;--panel-soft:#C7D2CB;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12160F;--bg-raised:#1A211B;--sidebar:#171E17;--panel:#0F1D18;
  --ink:#E9EDE8;--ink-soft:#A9B3A9;--ink-faint:#8A958C;--line:#2A322B;
  --accent:#6FAE97;--accent-ink:#0E1A15;--accent-soft:#223028;--amber:#D8AE72;--amber-soft:#2E2618;
  --red:#E39A8D;--red-soft:#33211E;--blue:#8DB6D6;--blue-soft:#1C2A36;--focus:#7DB2FF;}}
:root[data-theme="dark"]{
  --bg:#12160F;--bg-raised:#1A211B;--sidebar:#171E17;--panel:#0F1D18;
  --ink:#E9EDE8;--ink-soft:#A9B3A9;--ink-faint:#8A958C;--line:#2A322B;
  --accent:#6FAE97;--accent-ink:#0E1A15;--accent-soft:#223028;--amber:#D8AE72;--amber-soft:#2E2618;
  --red:#E39A8D;--red-soft:#33211E;--blue:#8DB6D6;--blue-soft:#1C2A36;--focus:#7DB2FF;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;margin:0;color:var(--ink);line-height:1.25}
p{margin:0}a{color:inherit;text-decoration:none}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:1000}
.skip:focus{left:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.muted{color:var(--ink-soft)}.faint{color:var(--ink-faint)}
.link{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:transparent}
.link:hover{text-decoration-color:currentColor}
.ico{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}.ico.lg{width:24px;height:24px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:8px;font-size:.95rem;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:background .15s,opacity .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}.btn-primary:hover{opacity:.9}
.btn-ghost{background:var(--bg-raised);color:var(--ink);border-color:var(--line)}.btn-ghost:hover{background:var(--accent-soft)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.btn-danger-ghost{background:transparent;color:var(--red);border-color:var(--red)}.btn-danger-ghost:hover{background:var(--red-soft)}
.btn-text{background:none;border:none;color:var(--ink-soft);padding:10px 8px;min-height:44px;font-weight:500}.btn-text:hover{color:var(--ink);text-decoration:underline}
.btn-sm{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg-raised);font-size:.87rem;color:var(--ink-soft)}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}
.icon-only{width:44px;height:44px;padding:0;justify-content:center}

/* tags / badges */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;line-height:1.5}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.neutral{background:var(--sidebar);color:var(--ink-soft)}
.tag .ico{width:13px;height:13px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;background:currentColor;opacity:.3;border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}
.bars i.on{opacity:1}

/* forms */
.field{margin-bottom:22px}
.field>label,.field .field-label{display:flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600;margin-bottom:6px}
.req{color:var(--amber);font-weight:700}
.opt-mark{font-weight:400;color:var(--ink-faint);font-size:.82rem}
.hint{font-size:.84rem;color:var(--ink-soft);margin-bottom:10px;max-width:62ch}
.input,.field select,.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=tel],.field textarea,select.input{width:100%;min-height:44px;padding:10px 14px;border-radius:8px;border:1px solid #8b968e;background:var(--bg-raised);color:var(--ink)}
[data-theme=dark] .input,[data-theme=dark] .field select,[data-theme=dark] .field input,[data-theme=dark] .field textarea{border-color:#4b574e}
.field textarea{resize:vertical;min-height:84px}
.field [aria-invalid=true]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.err{display:flex;gap:6px;align-items:center;color:var(--red);font-size:.84rem;margin-top:6px;font-weight:500}
.note{font-size:.8rem;color:var(--ink-faint);margin-top:5px}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:.88rem;color:var(--ink-soft);background:var(--bg-raised);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed=true]::before{content:"✓";font-weight:700}
.radio-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.radio-card{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg-raised);cursor:pointer;font-size:.9rem}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-card:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.radio-card input{margin-top:4px;accent-color:var(--accent)}
.radio-card small{display:block;color:var(--ink-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
.switch{position:relative;width:46px;height:26px;flex-shrink:0;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:#8b968e;border-radius:999px;transition:background .15s}
.switch .track::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::before{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:3px solid var(--focus);outline-offset:2px}
.switch input:disabled{cursor:not-allowed}.switch input:disabled+.track{opacity:.5}
.segmented{display:inline-flex;background:var(--sidebar);border-radius:8px;padding:3px;flex-wrap:wrap}
.segmented button{min-height:38px;padding:6px 14px;border-radius:6px;border:none;background:none;font-size:.86rem;color:var(--ink-soft)}
.segmented button[aria-pressed=true],.segmented button[aria-selected=true]{background:var(--bg-raised);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.day-row{display:flex;gap:6px;flex-wrap:wrap}
.day-pill{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg-raised);font-size:.85rem;color:var(--ink-soft)}
.day-pill[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pw-meter{display:flex;gap:4px;margin-top:8px}.pw-meter i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pw-meter i.on{background:var(--accent)}

/* cards & misc */
.card{background:var(--bg-raised);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.card.tight{padding:16px 18px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--accent-soft);font-size:.9rem}
.banner.amber{background:var(--amber-soft)}.banner.red{background:var(--red-soft)}.banner.blue{background:var(--blue-soft)}
.banner .ico{margin-top:2px}
.banner .b-body{flex:1}.banner strong{display:block}
.progress{height:8px;border-radius:999px;background:var(--sidebar);overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg-raised)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.78rem;color:var(--ink-soft);background:var(--sidebar);padding:10px 16px;font-weight:600}
.tbl td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
.breadcrumbs{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--ink-soft);margin-bottom:14px;flex-wrap:wrap}
.breadcrumbs a{color:var(--accent);font-weight:500}.breadcrumbs a:hover{text-decoration:underline}
.tabs{display:flex;gap:4px;background:var(--sidebar);border-radius:10px;padding:4px}
.tabs [role=tab]{flex:1;text-align:center;min-height:42px;padding:8px 12px;border-radius:8px;border:none;background:none;font-weight:600;font-size:.9rem;color:var(--ink-soft)}
.tabs [role=tab][aria-selected=true]{background:var(--bg-raised);color:var(--ink);box-shadow:var(--shadow)}
.empty{text-align:center;padding:48px 24px;background:var(--bg-raised);border:1px dashed var(--line);border-radius:14px}
.empty .ico{width:34px;height:34px;color:var(--ink-faint);margin-bottom:12px}
.empty h3{font-size:1.1rem;margin-bottom:8px}.empty p{color:var(--ink-soft);max-width:46ch;margin:0 auto 18px;font-size:.93rem}
.skeleton{background:linear-gradient(90deg,var(--sidebar),var(--line),var(--sidebar));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.sk-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:12px}
.sk-line{height:12px;margin:10px 0}

/* toast & modal */
#toasts{position:fixed;right:16px;bottom:16px;z-index:900;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem;display:flex;gap:10px;align-items:flex-start;animation:tin .2s}
.toast.err{background:var(--red);color:#fff;display:flex;margin:0;font-weight:400}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.55);z-index:800;display:flex;align-items:center;justify-content:center;padding:16px;animation:fin .15s}
@keyframes fin{from{opacity:0}}
.modal{background:var(--bg-raised);border-radius:14px;padding:26px;max-width:480px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h2{font-size:1.25rem;margin-bottom:8px}.modal .m-body{margin:12px 0 20px;color:var(--ink-soft);font-size:.94rem}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.drawer-ov{align-items:stretch;justify-content:flex-end;padding:0}
.drawer{background:var(--bg-raised);width:min(360px,100%);height:100%;padding:22px;overflow:auto;animation:din .2s}
@keyframes din{from{transform:translateX(30px);opacity:0}}

/* ---------- PUBLIC ---------- */
header.site{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:50}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;max-width:1080px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:1.1rem;color:var(--ink)}
.logo svg{color:var(--accent)}
nav.links{display:flex;gap:6px;font-size:.92rem;color:var(--ink-soft)}
nav.links a{padding:10px 12px;border-radius:8px}nav.links a:hover,nav.links a[aria-current=page]{color:var(--ink);background:var(--accent-soft)}
.nav-actions{display:flex;gap:10px;align-items:center}
.menu-btn{display:none}
@media (max-width:860px){nav.links{display:none}.menu-btn{display:inline-flex}.nav-actions .hide-m{display:none}}
.mobile-menu{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.mobile-menu a{padding:14px 12px;border-radius:8px;font-weight:500;border-bottom:1px solid var(--line)}
section.pub{padding:76px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){section.pub{padding:52px 0}}
.section-head{max-width:640px;margin-bottom:38px}
.section-head h2{font-size:clamp(1.5rem,3.4vw,1.9rem);margin-bottom:12px}
.section-head p{color:var(--ink-soft);font-size:1.03rem}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero{padding:64px 0 80px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:36px}.hero{padding:40px 0 56px}}
.hero h1{font-size:clamp(1.9rem,4.4vw,2.8rem);max-width:17ch}
.lede{margin-top:18px;font-size:1.12rem;color:var(--ink-soft);max-width:48ch}
.hero-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero-note{margin-top:16px;font-size:.85rem;color:var(--ink-faint)}
.problem-grid,.trust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:860px){.problem-grid,.trust-grid{grid-template-columns:1fr}}
.problem{padding:20px 22px;border-radius:12px;background:var(--bg-raised);border:1px solid var(--line)}
.problem .n{font-family:var(--f-head);font-size:1.6rem;color:var(--accent)}
.problem h3{font-size:1.02rem;margin:8px 0 6px}.problem p{font-size:.92rem;color:var(--ink-soft)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,1fr)}}@media (max-width:560px){.steps{grid-template-columns:1fr}}
.step{border-top:2px solid var(--accent);padding-top:14px}
.step .num{font-family:var(--f-head);font-size:1.5rem;color:var(--accent)}
.step h3{font-size:1.02rem;margin:8px 0 6px}.step p{color:var(--ink-soft);font-size:.92rem}
.sample-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:start}
@media (max-width:900px){.sample-grid{grid-template-columns:1fr}}
.capgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 32px}
@media (max-width:860px){.capgrid{grid-template-columns:repeat(2,1fr)}}@media (max-width:560px){.capgrid{grid-template-columns:1fr}}
.cap .ico{width:28px;height:28px;color:var(--accent);margin-bottom:12px}
.cap h3{font-size:1.02rem;margin-bottom:6px}.cap p{color:var(--ink-soft);font-size:.92rem}
.aud-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.aud-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:520px){.aud-grid{grid-template-columns:1fr}}
.aud{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--bg-raised)}
.aud h3{font-size:.98rem;margin-bottom:4px}.aud p{font-size:.88rem;color:var(--ink-soft)}
.trust{padding:22px;border-radius:12px;border:1px solid var(--line);background:var(--bg-raised)}
.trust .ico{color:var(--accent);width:24px;height:24px;margin-bottom:10px}.trust h3{font-size:1rem;margin-bottom:6px}.trust p{font-size:.9rem;color:var(--ink-soft)}
details{border-bottom:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600;font-size:1.02rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 0;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:1.4rem;color:var(--accent);line-height:1}
details[open] summary::after{content:"–"}
details p{padding:0 0 18px;color:var(--ink-soft);font-size:.96rem;max-width:66ch}
.final-cta{background:var(--panel);color:#EFF3EF;border-radius:18px;padding:52px 44px}
@media (max-width:640px){.final-cta{padding:34px 22px}}
.final-cta h2{color:#F4F7F4;font-size:clamp(1.4rem,3vw,1.8rem);max-width:24ch}
.final-cta p{color:var(--panel-soft);margin-top:12px;max-width:52ch}
.final-cta .btn-primary{background:#F4F7F4;color:var(--panel);margin-top:22px}
footer.site{padding:48px 0 40px;border-top:1px solid var(--line)}
.foot-cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;font-size:.9rem}
@media (max-width:760px){.foot-cols{grid-template-columns:1fr 1fr}}
.foot-cols h4{font-family:var(--f-body);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:10px}
.foot-cols a{display:block;padding:5px 0;color:var(--ink-soft)}.foot-cols a:hover{color:var(--accent)}
.footer-disclaimer{font-size:.82rem;color:var(--ink-soft);max-width:78ch;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.page-hero{padding:56px 0 30px}.page-hero h1{font-size:clamp(1.7rem,4vw,2.3rem);margin-bottom:12px}
.prose{max-width:70ch}.prose h2{font-size:1.25rem;margin:30px 0 10px}.prose p,.prose li{color:var(--ink-soft);margin-bottom:10px}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1000px){.price-grid{grid-template-columns:repeat(2,1fr)}}@media (max-width:560px){.price-grid{grid-template-columns:1fr}}
.plan{display:flex;flex-direction:column;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--bg-raised)}
.plan.featured{border:2px solid var(--accent)}
.plan h3{font-size:1.15rem}.plan .for{color:var(--ink-soft);font-size:.88rem;margin:4px 0 16px}
.plan ul{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:9px;font-size:.92rem;flex:1}
.plan li{display:flex;gap:8px}.plan li .ico{color:var(--accent);margin-top:3px}
.plan .price{font-family:var(--f-head);font-size:1.05rem;margin-bottom:14px;color:var(--ink-soft)}

/* digest card sample */

function toast(msg, type = '') {

let modalStack = [];
function modal({ title, body = '', actions = [], dismiss = true, drawer = false, wide = false }) {
  const prev = document.activeElement;
  const ov = document.createElement('div'); ov.className = 'overlay' + (drawer ? ' drawer-ov' : '');
  const id = 'm' + uid();
  ov.innerHTML = `<div class="${drawer ? 'drawer' : 'modal'}" role="dialog" aria-modal="true" aria-labelledby="${id}" ${wide ? 'style="max-width:620px"' : ''}>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><h2 id="${id}">${esc(title)}</h2>${dismiss ? `<button class="btn-text" data-close aria-label="Закрыть" style="padding:4px;min-height:36px">${ic('x')}</button>` : ''}</div>
    <div class="m-body">${body}</div>
    ${actions.length ? `<div class="m-actions">${actions.map((a, i) => `<button class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>`;
  const close = () => { ov.remove(); modalStack = modalStack.filter(x => x !== close); prev && prev.focus && prev.focus(); };
  close._d = dismiss;
  ov.addEventListener('click', e => {
    if (e.target === ov && dismiss) close();
    if (drawer && e.target.closest('a')) close();
    if (e.target.closest('[data-close]')) close();
    const b = e.target.closest('[data-i]');
    if (b) { const a = actions[+b.dataset.i]; if (!a.on || a.on(ov, close) !== false) close(); }
  });
  $('#modal-root').appendChild(ov); modalStack.push(close); ov._dismiss = dismiss;
  (ov.querySelector('[autofocus]') || ov.querySelector('input,select,textarea,button:not([data-close])') || ov.querySelector('button'))?.focus();
  return { close, el: ov };
}
const confirmBox = (title, body, label, cls, on) => modal({ title, body, actions: [{ label: 'Отмена' }, { label, cls, on }] });

const F = { q: '', period: 'all', topic: '', impact: '', status: 'all', sort: 'date', personal: false, page: 1 };
const PAGE = 5;
function filterChanges(ignoreStatus) {
  const q = F.q.trim().toLowerCase();
  let r = CHANGES.filter(c => {
    if (q && !(c.title + ' ' + c.summary + ' ' + c.what + ' ' + c.agency + ' ' + TOPICS[c.topic]).toLowerCase().includes(q)) return false;
    if (F.period !== 'all' && -c.pub > +F.period) return false;
    if (F.topic && c.topic !== F.topic) return false;
    if (F.impact && c.impact !== F.impact) return false;
    if (F.personal && !isPersonal(c)) return false;
    if (!ignoreStatus) { if (F.status === 'new' && isRead(c)) return false; if (F.status === 'read' && !isRead(c)) return false; if (F.status === 'saved' && !isSaved(c)) return false; if (F.status === 'attn' && !attention().includes(c)) return false; }
    return true;
  });
  const cmp = { date: (a, b) => b.pub - a.pub, impact: (a, b) => IMP_RANK[b.impact] - IMP_RANK[a.impact] || b.pub - a.pub, eff: (a, b) => (a.eff ?? 9999) - (b.eff ?? 9999) }[F.sort];
  return r.sort(cmp);
}
const opt = (v, t, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${t}</option>`;
const filterFields = (p = '') => `<select class="fs" data-filter="period" aria-label="Период">${[['all', 'Любой период'], ['7', 'За неделю'], ['30', 'За месяц'], ['90', 'За 3 месяца']].map(([v, t]) => opt(v, t, F.period)).join('')}</select>

    case 'ved': return `${fTog('vedExport', 'Экспортируем товары или услуги', 'Продажи иностранным клиентам', 'ВЭД, таможенные нормы')}${fTog('vedImport', 'Импортируем товары', 'Закупки у иностранных поставщиков', 'ВЭД, таможенные нормы')}`;

function validateStep(id) {
  const p = S.company, e = {};
  if (id === 'basics') { if (!p.name.trim()) e.name = 'Укажите название компании'; if (!p.form) e.form = 'Выберите форму'; if (!p.size) e.size = 'Выберите размер компании'; if (p.inn && !/^(\d{10}|\d{12})$/.test(p.inn.trim())) e.inn = 'ИНН состоит из 10 или 12 цифр'; }
  if (id === 'industry' && !p.industry) e.industry = 'Выберите основную отрасль';
  if (id === 'regions' && !p.regions.length) e.regions = 'Выберите хотя бы один регион';
  if (id === 'structure' && !p.branches) e.branches = 'Ответьте на вопрос';
  if (id === 'staff' && !p.headcount) e.headcount = 'Укажите численность';
  if (id === 'contacts') { if (!p.contactEmail) e.contactEmail = 'Укажите почту'; else if (!validEmail(p.contactEmail)) e.contactEmail = 'Проверьте адрес почты'; }
  return e;
}

/* =====================  ROUTER  ===================== */
const root = $('#root');
let curPath = null, pendingScroll = null, demoOpen = false, viewErr = {}, viewVals = {}, forgotSent = false;
const TITLES = { '/': 'Мониторинг изменений законодательства для бизнеса', '/faq': 'Вопросы и ответы', '/pricing': 'Тарифы', '/about': 'О сервисе', '/contacts': 'Контакты', '/privacy': 'Политика конфиденциальности', '/terms': 'Пользовательское соглашение', '/login': 'Вход', '/register': 'Регистрация', '/forgot': 'Восстановление пароля', '/onboarding': 'Настройка аккаунта', '/app': 'Обзор', '/app/digests': 'Дайджесты', '/app/saved': 'Сохранённое', '/app/profile': 'Профиль компании', '/app/notifications': 'Настройки уведомлений', '/app/telegram': 'Подключение Telegram', '/app/team': 'Команда и доступы', '/app/plan': 'Персональный план', '/app/account': 'Настройки аккаунта', '/app/support': 'Поддержка' };
const getPath = () => (location.hash.replace(/^#/, '') || '/').split('?')[0];
const go = p => { location.hash = '#' + p; };

function resolve(path) {
  let m;
  if (path.startsWith('/app')) {
    if (!S.user) { return { redirect: '/login' }; }
    if (!S.onboarded) return { redirect: '/onboarding' };
  }
  if (['/login', '/register'].includes(path) && S.user) return { redirect: S.onboarded ? '/app' : '/onboarding' };
  if (path === '/onboarding') { if (!S.user) return { redirect: '/register' }; if (S.onboarded) return { redirect: '/app' }; }
  const T = {
    '/': viewHome, '/faq': viewFaq, '/pricing': viewPricing, '/about': viewAbout, '/contacts': viewContacts, '/privacy': () => viewLegal('privacy'), '/terms': () => viewLegal('terms'),
    '/login': () => viewLogin(viewErr, viewVals), '/register': () => viewRegister(viewErr, viewVals), '/forgot': () => viewForgot(forgotSent), '/onboarding': viewOnboarding,
    '/app': viewOverview, '/app/digests': viewDigests, '/app/saved': viewSaved, '/app/profile': viewProfile, '/app/notifications': viewNotifications, '/app/telegram': viewTelegram, '/app/team': viewTeam, '/app/plan': viewPlan, '/app/account': viewAccount, '/app/support': viewSupport
  };
  if (T[path]) return { html: T[path](), title: TITLES[path] };
  if ((m = path.match(/^\/app\/change\/([\w-]+)$/))) return { html: viewChange(m[1]), title: CH[m[1]] ? CH[m[1]].title : 'Материал не найден' };
  return { html: pubShell(`<div class="wrap"><div class="empty" style="margin:60px 0">${ic('search')}<h3>Страница не найдена</h3><p>Возможно, ссылка устарела или адрес введён неточно.</p><a class="btn btn-primary" href="#/">На главную</a></div></div>`), title: 'Страница не найдена' };
}

function render({ keep = false } = {}) {
  const path = getPath(), r = resolve(path);
  if (r.redirect) { go(r.redirect); return; }
  const changed = path !== curPath, y = window.scrollY;
  if (changed) {
    $$('.overlay').forEach(o => { if (o._dismiss) o.remove(); }); modalStack = modalStack.filter(f => f._d === false);
    if (path !== '/app/notifications') { ND = null; NDirty = false; }
    PErr = {}; if (!['/login', '/register'].includes(path)) { viewErr = {}; viewVals = {}; } if (path !== '/forgot') forgotSent = false;

  if (id === 'regForm') {
    const v = { name: val('name'), email: val('email'), agree: f.elements.agree.checked }, pass = f.elements.pass.value, err = {};
    if (v.name.length < 2) err.name = 'Введите имя'; if (!validEmail(v.email)) err.email = 'Проверьте адрес почты'; if (pass.length < 8 || !/[a-zа-я]/i.test(pass) || !/\d/.test(pass)) err.pass = 'Минимум 8 символов, буква и цифра'; if (!v.agree) err.agree = 'Необходимо принять условия';
    if (Object.keys(err).length) { viewErr = err; viewVals = { ...v, pass }; render({ keep: true }); focusInvalid(); return; }
    S = Object.assign(defState(), { user: { name: v.name, email: v.email } }); OB.step = 1; OB.mode = 'create'; OB.err = {}; OB.tmp = { form: 'ООО', name: '', size: '', industry: '', topics: [] }; persist(); viewErr = {}; viewVals = {}; go('/onboarding'); return;
  }
  if (id === 'loginForm') {
    const v = { email: val('email') }, pass = f.elements.pass.value, err = {};
    if (!validEmail(v.email)) err.email = 'Проверьте адрес почты'; if (pass.length < 8) err.pass = 'Введите пароль (минимум 8 символов)';
    if (Object.keys(err).length) { viewErr = err; viewVals = v; render({ keep: true }); focusInvalid(); return; }
    const nm = v.email.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    S.user = S.user && S.user.email === v.email ? S.user : { name: S.user?.name || nm, email: v.email }; persist(); viewErr = {}; go(S.onboarded ? '/app' : '/onboarding'); return;
  }
  if (id === 'forgotForm') { if (!validEmail(val('email'))) { toast('Проверьте адрес почты', 'err'); return; } forgotSent = true; render(); return; }
  if (id === 'contactForm') { if (val('name').length < 2 || !validEmail(val('email')) || val('msg').length < 5) { toast('Заполните имя, почту и сообщение', 'err'); return; } f.reset(); toast('Сообщение отправлено. Мы скоро ответим'); return; }
  if (id === 'obVerify') { const code = $$('[data-code]').map(x => x.value).join(''); if (code.length < 6) { OB.err = { code: 'Введите все 6 цифр' }; render({ keep: true }); $('#code-0').focus(); return; } OB.err = {}; OB.step = 2; render(); return; }
  if (id === 'obCompany') { OB.tmp.name = $('#ob-name').value.trim(); OB.tmp.form = $('#ob-form').value; if (!OB.tmp.name) { OB.err = { name: 'Укажите название компании' }; render({ keep: true }); focusInvalid(); return; } OB.err = {}; S.company.name = OB.tmp.name; S.company.form = OB.tmp.form; persist(); OB.step = 3; render(); return; }
  if (id === 'obJoin') { if ($('#ob-code').value.trim().length < 4) { OB.err = { code: 'Введите код приглашения' }; render({ keep: true }); focusInvalid(); return; } loadDemoCompany(); S.team = [{ id: 'own', name: 'Мария Орлова', email: 'm.orlova@nordwood.ru', role: 'owner', status: 'active' }, { id: 'me', name: S.user.name, email: S.user.email, role: 'member', status: 'active' }]; S.joined = true; S.onboarded = true; persist(); toast('Вы присоединились к компании «Нордвуд Логистика»'); go('/app'); return; }
  if (id === 'obBasics') { const err = {}; if (!OB.tmp.industry) err.industry = 'Выберите отрасль'; if (!OB.tmp.size) err.size = 'Выберите размер компании'; if (Object.keys(err).length) { OB.err = err; render({ keep: true }); focusInvalid(); return; } OB.err = {}; Object.assign(S.company, { industry: OB.tmp.industry, size: OB.tmp.size }); S.company.saved.basics = 1; S.company.saved.industry = 1; persist(); OB.step = 4; render(); return; }
  if (id === 'obTopics') { finishOnboarding(); return; }
  if (id === 'profForm') {
    const s = STEPS[S.profileStep - 1], err = validateStep(s.id);
    if (Object.keys(err).length) { PErr = err; render({ keep: true }); focusInvalid(); return; }
    PErr = {}; S.company.saved[s.id] = 1; delete S.company.skipped[s.id];
    const last = S.profileStep === STEPS.length; if (!last) S.profileStep++; persist();
    toast(last ? 'Профиль сохранён' + (profilePct() < 100 ? '' : ' — заполнен на 100%') : 'Шаг сохранён'); render(); return;
  }
  if (id === 'accForm') { const n = $('#a-name').value.trim(), m = $('#a-mail').value.trim(); if (n.length < 2 || !validEmail(m)) { toast('Проверьте имя и почту', 'err'); return; } S.user.name = n; S.user.email = m; S.user.phone = $('#a-phone').value.trim(); persist(); toast('Данные сохранены'); render({ keep: true }); return; }
  if (id === 'pwForm') { const a = $('#pw0').value, b = $('#pw1').value; let m = ''; if (!a) m = 'Введите текущий пароль'; else if (b.length < 8 || !/[a-zа-я]/i.test(b) || !/\d/.test(b)) m = 'Новый пароль: минимум 8 символов, буква и цифра'; $('#pwErr').innerHTML = m ? fieldErr(m) : ''; if (!m) { f.reset(); toast('Пароль изменён'); } return; }
  if (id === 'supForm') { if ($('#s-m').value.trim().length < 5) { $('#s-e').innerHTML = fieldErr('Опишите ваш вопрос'); return; } f.reset(); $('#s-e').innerHTML = ''; toast('Сообщение отправлено. Ответим в течение рабочего дня'); }
});

window.addEventListener('hashchange', () => render());
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change', () => render({ keep: true }));
render();

</script>
</body>
</html>
