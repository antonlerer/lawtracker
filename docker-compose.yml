# Весь стек одной командой:  cp deploy/env.example .env && nano .env && docker compose up -d
# Сервисы: db (PostgreSQL) → migrate (Alembic, один раз) → app, ingest, notify; caddy даёт HTTPS на вашем домене.
x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://lawtracker:${POSTGRES_PASSWORD}@db:5432/lawtracker
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lawtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawtracker -d lawtracker"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  app:
    <<: *app

  ingest:        # новые акты с pravo.gov.ru раз в INGEST_INTERVAL секунд (по умолчанию час)
    <<: *app
    command: ["sh", "-c", "python -m app.cli ingest --loop ${INGEST_INTERVAL:-3600}"]

  notify:        # рассылка дайджестов по расписанию клиентов, проверка каждые 5 минут
    <<: *app
    command: ["python", "-m", "app.cli", "notify", "--loop", "300"]

  caddy:         # автоматический сертификат Let's Encrypt для DOMAIN
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
