<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1250px;height:750px;background:#FFFFFF}
.wrap{width:1250px;height:750px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#FFFFFF}
.mark{position:relative;width:400px;height:400px;border-radius:108px 108px 108px 32px;background:#22574A;display:grid;place-items:center;
 font:700 252px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#F4F7F4;padding-bottom:8px;box-sizing:border-box;margin-top:44px}
.mark:after{content:"";position:absolute;right:44px;top:-48px;width:84px;height:144px;background:#C48A33;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.name{font:700 124px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#17352C;letter-spacing:2px;white-space:nowrap}
.name span{color:#22574A;margin-left:4px}
</style>
<div class="wrap"><div class="mark">§</div><div class="name">Law<span>Tracker</span></div></div>
