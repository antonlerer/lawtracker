<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1024px;height:1024px;background:#17352C}
.wrap{width:1024px;height:1024px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;background:
 radial-gradient(circle at 20% 15%,#1E4137 0,#17352C 60%)}
.mark{position:relative;width:420px;height:420px;border-radius:112px 112px 112px 34px;background:#F4F7F4;display:grid;place-items:center;
 font:700 266px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#22574A;padding-bottom:8px;box-sizing:border-box;margin-top:30px}
.mark:after{content:"";position:absolute;right:46px;top:-50px;width:88px;height:152px;background:#D8AE72;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.name{font:700 124px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#F4F7F4;letter-spacing:1px}
.name span{color:#D8AE72}
</style>
<div class="wrap"><div class="mark">§</div><div class="name">Law<span>Tracker</span></div></div>
