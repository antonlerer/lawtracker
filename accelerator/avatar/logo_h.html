<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1600px;height:600px;background:#17352C}
.wrap{width:1600px;height:600px;display:flex;align-items:center;justify-content:center;gap:60px;background:
 radial-gradient(circle at 10% 10%,#1E4137 0,#17352C 65%)}
.mark{position:relative;flex:none;width:260px;height:260px;border-radius:70px 70px 70px 21px;background:#F4F7F4;display:grid;place-items:center;
 font:700 165px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#22574A;padding-bottom:6px;box-sizing:border-box;margin-top:30px}
.mark:after{content:"";position:absolute;right:30px;top:-32px;width:56px;height:94px;background:#D8AE72;clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.name{font:700 140px/1 "PT Serif",Georgia,"DejaVu Serif",serif;color:#F4F7F4;letter-spacing:2px;white-space:nowrap}
.name span{color:#D8AE72;margin-left:6px}
</style>
<div class="wrap"><div class="mark">§</div><div class="name">Law<span>Tracker</span></div></div>
